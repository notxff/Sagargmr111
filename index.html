<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Fire Team</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    background:#202020;
    color:#fff;
    font-family:Arial,sans-serif;
    min-height:100vh;
}

.header{
    height:100px;
    background:linear-gradient(135deg,#55c9ee,#65d4f5);
    display:flex;
    align-items:center;
    justify-content:center;
}

.header h1{
    font-size:31px;
    font-weight:500;
}

.container{
    width:100%;
    max-width:520px;
    margin:28px auto;
    padding:0 16px 40px;
}

.video-box{
    width:100%;
    aspect-ratio:16/9;
    background:#111;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 5px 20px #0008;
}

.video-box video{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}

.offer-wrapper{
    margin-top:46px;
    padding:2px;
    border-radius:22px;
    background:linear-gradient(
        90deg,
        #ff0000,#ff8a00,#ffe600,
        #00ff66,#00d9ff,#8a00ff,#ff00d4
    );
    background-size:400% 400%;
    animation:borderMove 5s linear infinite;
}

@keyframes borderMove{
    0%{background-position:0 50%}
    50%{background-position:100% 50%}
    100%{background-position:0 50%}
}

.offer-card{
    background:#111;
    border-radius:20px;
    padding:20px;
}

.offer-top{
    display:flex;
    align-items:center;
    gap:15px;
}

.offer-image{
    width:86px;
    height:86px;
    flex-shrink:0;
    border-radius:13px;
    object-fit:cover;
}

.offer-info{
    min-width:0;
    flex:1;
}

.offer-title{
    font-size:24px;
    font-weight:700;
    margin-bottom:5px;
}

.offer-subtitle{
    font-size:15px;
    color:#ddd;
    margin-bottom:7px;
}

.stars{
    color:#ffd900;
    font-size:20px;
    letter-spacing:2px;
}

.install-button{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:68px;
    margin-top:22px;
    background:#00e878;
    color:#fff;
    border-radius:40px;
    font-size:27px;
    font-weight:600;
    text-decoration:none;
}

.notice{
    text-align:center;
    color:#888;
    font-size:12px;
    margin-top:17px;
}

@media(max-width:480px){
    .header h1{font-size:29px}
    .offer-card{padding:18px}
    .offer-image{width:80px;height:80px}
    .offer-title{font-size:23px}
}
</style>
</head>

<body>

<header class="header">
    <h1>Free Fire Team</h1>
</header>

<main class="container">

    <!-- GITHUB VIDEO -->
    <div class="video-box">
        <video controls playsinline preload="metadata">
            <source src="newfreefire332.mp4" type="video/mp4">
            Your browser does not support video playback.
        </video>
    </div>

    <!-- OFFER CARD -->
    <div class="offer-wrapper">
        <div class="offer-card">

            <div class="offer-top">

                <img
                    class="offer-image"
                    src="https://i.postimg.cc/g0TXFPFQ/Picsart-26-09-18-12-23-05-008.jpg"
                    alt="Macro Space Panel">

                <div class="offer-info">
                    <div class="offer-title">
                        Macro Space Panel
                    </div>

                    <div class="offer-subtitle">
                        Open the offer
                    </div>

                    <div class="stars">
                        ★★★★★
                    </div>
                </div>

            </div>

            <a
                class="install-button"
                href="https://1024terabox.com/s/1wJilXJnjQ1RuwJ3VHyp4SA"
                target="_blank"
                rel="noopener noreferrer">
                Install
            </a>

        </div>
    </div>

    <div class="notice">
        Offer availability and requirements may vary.
    </div>

</main>

</body>
</html>
